# mptest concurrency-fuzz workload: one container that runs Bitcoin Core's
# libmultiprocess IPC test (mptest) under the fuzzing scheduler in a loop until
# it crashes or hangs, then shuts the VM down. The in-kernel sched_ext fuzzing
# scheduler is loaded by the guest at boot (scx-init); run.sh opts mptest in by
# wrapping it in thread-fuzz (bind-mounted into the container by the guest),
# which switches it into SCHED_EXT so it (and the IPC server subprocess it forks)
# are fuzzed. Under bedrock's single vCPU + deterministic emulated TSC the whole
# run replays from the getrandom stream that drives the schedule.
#
# The image comes from images.tar (built by ./build.sh); never pulled.

services:
  mptest:
    image: bedrock/mptest:latest
    pull_policy: never
    container_name: mptest
    privileged: true  # Required for the VMCALL helper and for setting SCHED_EXT.
    # No `pid: host` needed: thread-fuzz sets SCHED_EXT on mptest directly, so
    # the fuzzing scheduler governs it (and its children) regardless of PID
    # namespace; the container keeps its private one.
    command: ["/usr/local/bin/run.sh"]
    # Tune the search without an image rebuild:
    #   MPTEST_MAX_ITERS - loop bound before giving up on this seed (default 500)
    #   MPTEST_HANG_SECS - per-iteration hang watchdog in seconds (default 30)
    # environment:
    #   MPTEST_MAX_ITERS: "500"
    #   MPTEST_HANG_SECS: "30"
